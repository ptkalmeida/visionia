<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Vision AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        label {
            font-weight: bold;
            margin-top: 1rem;
            display: block;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 0.5rem;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .resposta {
            margin-top: 2rem;
            background: #f9f9f9;
            padding: 1rem;
            border-left: 4px solid #4CAF50;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔍 Vision IA</h2>
        <form method="post">
            <label for="pergunta">Pergunta:</label>
            <input type="text" id="pergunta" name="pergunta" required>

            <label for="filtro_nome">Filtrar por nome (opcional):</label>
            <input type="text" id="filtro_nome" name="filtro_nome">

            <button type="submit">Enviar</button>
        </form>

        {% if resposta %}
            <div class="resposta">
                <h3>📄 Resposta:</h3>
                {{ resposta }}
            </div>
        {% endif %}
    </div>
</body>
</html>
